[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: 单元测试（mock 外部依赖）
    integration: 集成测试（需要真实服务）
    slow: 慢速测试
    p0: P0 缺陷修复相关
    p1: P1 功能增强相关
    p2: P2 架构升级相关
